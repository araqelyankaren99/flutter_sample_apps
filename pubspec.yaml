name: flutter_sample_apps
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.11.0
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  email_validator: ^3.0.0
  flutter_polyline_points: ^2.1.0
  http: ^1.3.0
  intl: ^0.20.2
  pin_code_fields: ^8.0.1
  url_launcher: ^6.3.1
  flutter_bloc: ^9.1.0
  graphql: ^5.1.3
  graphql_flutter: ^5.1.2
  provider: ^6.1.4
  equatable: ^2.0.7
  flutter_google_places_sdk: ^0.4.1
  marquee: ^2.3.0
  shared_preferences: ^2.5.3
  open_file: ^3.5.10
  path_provider: ^2.1.5
  progress_indicators: ^1.0.0
  uuid: ^4.5.1
  mime: ^2.0.0
  easy_mask: ^2.0.1
  connectivity_plus: ^6.1.3
  flutter_rating_bar: ^4.0.1
  stripe_sdk: ^5.0.0
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  otp_autofill: ^4.1.0
  location: ^8.0.0
  internet_connection_checker: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
